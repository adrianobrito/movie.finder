plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.moviefinder'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.register('downloadImdbDatasets', JavaExec) {
    group = 'data'
    description = 'Downloads and validates the IMDb datasets required by the MVP.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.moviefinder.ingestion.ImdbDatasetDownloader'

    doFirst {
        def destination = providers.gradleProperty('imdbDataDir')
                .orElse(providers.environmentVariable('IMDB_DATA_DIR'))
                .orElse('data/imdb/raw')
                .get()
        def refresh = providers.gradleProperty('imdbRefresh')
                .map { value -> value.toBoolean() }
                .getOrElse(false)

        setArgs(['--destination', destination] + (refresh ? ['--refresh'] : []))
    }
}

tasks.register('importImdbDatasets', JavaExec) {
    group = 'data'
    description = 'Imports the six IMDb archives into canonical movie and person NDJSON files.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.moviefinder.ingestion.ImdbIngestionPipeline'
    maxHeapSize = '3g'

    doFirst {
        def source = providers.gradleProperty('imdbDataDir')
                .orElse(providers.environmentVariable('IMDB_DATA_DIR'))
                .orElse('data/imdb/raw')
                .get()
        def destination = providers.gradleProperty('imdbOutputDir')
                .orElse(providers.environmentVariable('IMDB_OUTPUT_DIR'))
                .orElse('data/imdb/canonical')
                .get()
        setArgs(['--source', source, '--destination', destination])
    }
}

tasks.register('indexImdbDatasets', JavaExec) {
    group = 'data'
    description = 'Creates the OpenSearch read model and bulk indexes canonical IMDb records.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.moviefinder.search.OpenSearchIndexer'

    doFirst {
        def source = providers.gradleProperty('imdbOutputDir')
                .orElse(providers.environmentVariable('IMDB_OUTPUT_DIR'))
                .orElse('data/imdb/canonical')
                .get()
        def url = providers.gradleProperty('opensearchUrl')
                .orElse(providers.environmentVariable('OPENSEARCH_URL'))
                .orElse('http://localhost:9200')
                .get()
        def recreate = providers.gradleProperty('opensearchRecreate')
                .map { value -> value.toBoolean() }
                .getOrElse(false)
        setArgs(['--source', source, '--url', url] + (recreate ? ['--recreate'] : []))
    }
}
